<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — ECG Fusion</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="bg-blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <nav>
    <a href="/index.html" class="logo"><span class="pulse-dot"></span> ECG Fusion</a>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Welcome back</h2>
      <p class="sub">Log in to run a heart health check.</p>
      <form onsubmit="handleLogin(event)">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" required autofocus>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
        <div id="error-msg" class="error-msg"></div>
      </form>
      <div class="auth-switch">Don't have an account? <a href="/register.html">Register</a></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
